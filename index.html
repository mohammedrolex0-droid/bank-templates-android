<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07201c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>قوالب البنوك السودانية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07201c;--card:#0e332d;--line:#1d5a4f;--gold:#e8c35a;--txt:#f1f8f5;--mut:#8db5aa;--ok:#3ddc84;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;max-width:480px;margin:0 auto;position:relative}
main{height:100%;overflow-y:auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top small{color:var(--gold);font-size:14px}.top h1{font-size:26px;font-weight:800}
.ib{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--gold);font-size:20px;display:grid;place-items:center;cursor:pointer}
.hero{background:linear-gradient(135deg,#0f4a3f,#0b2f29);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hero .pin{width:84px;height:84px;border-radius:50%;background:#154d42;display:grid;place-items:center;flex:none}
.hero small{color:var(--gold);font-size:13px}.hero h2{font-size:21px;line-height:1.5;margin:2px 0 12px}
.btn{background:var(--gold);color:#2a2105;border:0;border-radius:14px;padding:11px 18px;font:700 15px 'Tajawal',sans-serif;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:right}
.stat b{display:block;font-size:24px;margin:4px 0 0}.stat span{color:var(--mut);font-size:13px}
h3{font-size:22px;font-weight:800}.sub{color:var(--mut);font-size:13px;margin:2px 0 12px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;margin-bottom:8px}
.bk b{font-size:17px;display:block}.bk small{color:var(--mut);font-size:12px;display:block;margin:2px 0 8px}
.st{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.st i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.st.off{color:var(--bad)}.st.off i{background:var(--bad)}.st.on{color:var(--ok)}
.svc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;cursor:pointer;width:100%;color:var(--txt);text-align:right;font-family:inherit}
.svc .ic{width:58px;height:58px;border-radius:16px;background:#15483f;color:var(--gold);display:grid;place-items:center;font-size:26px;flex:none}
.svc b{font-size:19px;display:block}.svc small{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mut);font:500 14px 'Tajawal',sans-serif;cursor:pointer}
.chip.on{background:var(--gold);color:#2a2105;border-color:var(--gold);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tw{position:relative}
.tc{border-radius:16px;padding:12px;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer;color:#fff}
.tc .r1{display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:.95}
.tc .nm{font-size:14px;font-weight:700}.tc .ac{direction:ltr;text-align:right;font-size:12px;letter-spacing:1px;opacity:.9}
.big .tc{aspect-ratio:1.6;padding:18px}.big .tc .nm{font-size:22px}.big .tc .ac{font-size:17px}.big .tc .r1{font-size:14px}
.fav{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:14px;cursor:pointer}
.fav.on{color:#ff6b8a}
.tl{font-size:12px;color:var(--mut);margin:5px 2px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#051613;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:500 12px 'Tajawal',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;border-radius:18px;cursor:pointer}
nav button span{font-size:22px}nav button.on{background:var(--gold);color:#2a2105;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.sheet>div{background:#0b2a25;border-radius:26px 26px 0 0;border:1px solid var(--line);width:100%;max-width:480px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 5px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:500 16px 'Tajawal',sans-serif}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}.btn.g{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--mut);font-size:13px;line-height:1.7;margin-top:12px}
.sr{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.sr .l{display:flex;gap:12px;align-items:center}.sr .logo{margin:0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a2105;padding:10px 18px;border-radius:20px;font-weight:700;z-index:20;display:none}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.logo{background:none!important;padding:0;overflow:hidden}.logo img{width:100%;height:100%;border-radius:12px;object-fit:cover;display:block}
.ic2{width:58px;height:58px;border-radius:16px;background:#15483f;color:var(--gold);display:grid;place-items:center;font-size:26px;flex:none}
.cd{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:5%;border:1px solid rgba(255,255,255,.15);direction:rtl;line-height:1.25;cursor:pointer}
.ab{position:absolute}.ct{position:absolute;display:flex;flex-direction:column;text-align:center;gap:1.6em}.ct>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{background:#fff;border-radius:99em;font-weight:800;padding:.3em .5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.wa{background:#25a244;color:#fff;border-radius:99em;font-weight:800;padding:.45em .6em;white-space:nowrap;direction:ltr;text-align:center}
.li{display:block;border-radius:22%;object-fit:cover;background:#fff}
.pc{position:absolute;border-radius:50%;overflow:hidden;background:#fff}.pc img{width:100%;height:100%;object-fit:cover;display:block}.pc img.nl{object-fit:contain;padding:14%}
.rw{display:flex;gap:1.5em;align-items:center}.rw .pl{flex:1}.ic{width:11em;height:11em;border-radius:50%;display:grid;place-items:center;flex:none}
.row{flex-wrap:wrap}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sbody"></div></div>
<div class="toast" id="toast"></div>

function templates(){const list=T.filter(t=>st.f=='all'||t.b.id==st.f);
return `<div class="top"><div><small style="color:var(--gold)">المكتبة</small><h1>القوالب</h1></div><span class="stat" style="padding:8px 14px"><span>${list.length} قالب</span></span></div>
<div class="chips"><button class="chip ${st.f=='all'?'on':''}" onclick="flt('all')">الكل</button>${banks.map(b=>`<button class="chip ${st.f==b.id?'on':''}" onclick="flt('${b.id}')">${b.n}</button>`).join('')}</div>
<div class="tgrid">${list.map(t=>`<div class="tw"><button class="fav ${st.fav.has(t.id)?'on':''}" onclick="fv('${t.id}')" aria-label="مفضلة">♥</button><div onclick="edit('${t.id}')">${card(t,st.d)}</div><div class="tl">${t.b.n} · ${t.name}</div></div>`).join('')}</div>`}
function stat(){return `<div class="top"><div><small style="color:var(--gold)">مباشر</small><h1>حالة الخدمات</h1></div></div><p class="sub">الحالة يحددها مدير المنصة وليست تأكيداً رسمياً من البنك. البيانات هنا تجريبية.</p>
${banks.map(b=>`<div class="sr"><div class="l">${lgo(b)}<div><b style="font-size:17px">${b.n}</b><div style="color:var(--mut);font-size:12px">${b.s}</div></div></div><div class="st ${b.st?'on':'off'}"><i></i>${b.st?'يعمل':'متوقف'}</div></div>`).join('')}`}
function acct(){return `<div class="top"><div><small style="color:var(--gold)">👋 أهلاً محمد الخاتم</small><h1>حسابي</h1></div></div><div class="stats"><div class="stat"><span>المفضلة</span><b>${st.fav.size}</b></div><div class="stat"><span>تصاميمي</span><b>${st.mine}</b></div><div class="stat"><span>البنوك</span><b>${banks.length}</b></div></div><div class="note">القوالب مخصصة لبطاقات الحسابات فقط، ولا تتضمن إشعارات عمليات أو إيصالات تحويل.</div>`}
function render(){$('#app').innerHTML={home,templates,status:stat,account:acct}[st.tab]();
const n=[['home','🏠','الرئيسية'],['templates','🖌','القوالب'],['status','📡','الحالة'],['account','👤','حسابي']];
$('#nav').innerHTML=n.map(x=>`<button class="${st.tab==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');fit()}
function go(t){st.tab=t;render();$('#app').scrollTop=0}
function flt(f){st.f=f;render()}
function fv(id){st.fav.has(id)?st.fav.delete(id):st.fav.add(id);render()}
let cur;
function edit(id){cur=T.find(t=>t.id==id);const d=st.d;
$('#sbody').innerHTML=`<div id="pv" style="max-width:340px;margin:0 auto">${card(cur,d)}</div>
<label>الاسم</label><input id="f_n" value="${esc(d.n)}" oninput="up()" placeholder="الاسم الكامل">
<label>فرع البنك</label><input id="f_br" value="${esc(d.br)}" oninput="up()" placeholder="مثال: فرع ود مدني">
<label>رقم الحساب</label><input id="f_ac" value="${esc(d.ac)}" inputmode="numeric" oninput="up()" placeholder="رقم الحساب">
<label>رقم الواتساب</label><input id="f_wa" value="${esc(d.wa)}" inputmode="tel" oninput="up()" placeholder="09XXXXXXXX">
<label>صورة شخصية (اختيارية)</label><input id="f_ph" type="file" accept="image/*" onchange="pic(this)">
<div class="row"><button class="btn" onclick="save()">حفظ التصميم</button><button class="btn g" onclick="nopic()">إزالة الصورة</button><button class="btn g" onclick="closeS()">إغلاق</button></div>`;
$('#sheet').classList.add('show');fit()}
function up(){const d=st.d;d.n=$('#f_n').value;d.br=$('#f_br').value;d.ac=$('#f_ac').value;d.wa=$('#f_wa').value;$('#pv').innerHTML=card(cur,d);fit()}
function pic(i){const f=i.files[0];if(f){st.d.photo=URL.createObjectURL(f);up()}}
function nopic(){st.d.photo='';$('#f_ph').value='';up()}
function closeS(){$('#sheet').classList.remove('show');render()}
function save(){st.mine++;toast('تم حفظ التصميم');closeS()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
$('#sheet').addEventListener('click',e=>{if(e.target.id=='sheet')closeS()});
addEventListener('resize',fit);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
